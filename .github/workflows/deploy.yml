name: Build and Deploy to UAT

# Two phases: build the backend/frontend images and push them to this
# stack's private ECR repos, then SSM into the current uat-infra instance to
# pull the new images and recreate the containers. Replaces the old
# git-clone-and-build-on-the-box model, which only ever worked against the
# pre-migration cureocity-uat host (ec2-user, SSH deploy key) and has no
# equivalent on uat-infra (ubuntu user, no deploy key, images are pulled from
# ECR instead of built locally - see the Terraform user-data bootstrap).
on:
  push:
    branches:
      - uat-deploy
  # Manual runs from the GitHub UI: Actions -> "Build and Deploy to UAT" -> Run workflow
  workflow_dispatch:

permissions:
  id-token: write # required to mint the OIDC token for AssumeRoleWithWebIdentity
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 845021709999.dkr.ecr.ap-south-1.amazonaws.com
  PLATFORM_REPO: cureocity-uat-infra/open-wearables-platform
  FRONTEND_REPO: cureocity-uat-infra/open-wearables-frontend
  # Tags the uat-infra box actually pulls (must match the Terraform
  # open_wearables_platform_tag / open_wearables_frontend_tag defaults, and
  # the image: lines in docker-compose.yml).
  PLATFORM_TAG: latest
  FRONTEND_TAG: dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::845021709999:role/github-actions-open-wearables-uat-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend/platform image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.PLATFORM_REPO }}:${{ env.PLATFORM_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.PLATFORM_REPO }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend-uat
          cache-to: type=gha,mode=max,scope=backend-uat

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.dev
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${{ env.FRONTEND_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend-uat
          cache-to: type=gha,mode=max,scope=frontend-uat

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::845021709999:role/github-actions-open-wearables-uat-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve current uat-infra instance
        id: resolve
        # The instance ID changes on every spot-interruption replacement, so
        # it can never be hardcoded here - look it up by the Name tag the
        # ASG's launch template always sets (cureocity-uat-infra Terraform
        # stack), same way the IAM policy scopes ssm:SendCommand.
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=cureocity-uat-infra" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "No running cureocity-uat-infra instance found" >&2
            exit 1
          fi
          echo "Resolved uat-infra instance: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy to uat-infra via SSM
        env:
          INSTANCE_ID: ${{ steps.resolve.outputs.instance_id }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          PLATFORM_REPO: ${{ env.PLATFORM_REPO }}
          FRONTEND_REPO: ${{ env.FRONTEND_REPO }}
          PLATFORM_TAG: ${{ env.PLATFORM_TAG }}
          FRONTEND_TAG: ${{ env.FRONTEND_TAG }}
          AWS_REGION: ${{ env.AWS_REGION }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          cat > /tmp/deploy.sh <<SCRIPT
          #!/bin/bash
          # AWS-RunShellScript defaults to /bin/sh, which is dash on Ubuntu
          # (uat-infra) - dash has no -o pipefail, unlike the bash-as-sh
          # setup on the old cureocity-uat host this workflow originally
          # targeted. The shebang forces the SSM agent to actually use bash.
          set -euo pipefail

          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}

          docker pull ${ECR_REGISTRY}/${PLATFORM_REPO}:${PLATFORM_TAG}
          docker tag ${ECR_REGISTRY}/${PLATFORM_REPO}:${PLATFORM_TAG} open-wearables-platform:${PLATFORM_TAG}

          docker pull ${ECR_REGISTRY}/${FRONTEND_REPO}:${FRONTEND_TAG}
          docker tag ${ECR_REGISTRY}/${FRONTEND_REPO}:${FRONTEND_TAG} open-wearables-frontend:${FRONTEND_TAG}

          # docker-compose.yml on this box was restored from S3 by the
          # Terraform bootstrap, not git-cloned - it's not touched here.
          # --force-recreate recreates EVERY container even though
          # worker/beat/flower share the retagged :latest image with no
          # build section (compose would otherwise think they're unchanged
          # and skip them, leaving stale code running).
          cd /home/ubuntu/open-wearables
          docker compose up -d --force-recreate --remove-orphans
          docker image prune -f
          docker compose ps
          SCRIPT

          echo "--- deploy.sh: $(wc -l < /tmp/deploy.sh) lines ---"

          # Built as a JSON file directly (not through a nested jq pipe) -
          # that pattern proved unreliable to debug in the previous version
          # of this workflow (a silent empty commands=[""] payload).
          python3 -c "
          import json
          with open('/tmp/deploy.sh') as f:
              content = f.read()
          with open('/tmp/ssm-params.json', 'w') as f:
              json.dump({'commands': [content]}, f)
          "

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --comment "GitHub Actions deploy ${GH_SHA}" \
            --query 'Command.CommandId' --output text)

          echo "SSM command id: $COMMAND_ID"

          for i in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "[$i] Status: $STATUS"
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "--- stdout ---"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text
                echo "--- stderr ---"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' --output text
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "Timed out waiting for the SSM command to finish"
          exit 1
