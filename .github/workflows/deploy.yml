name: Deploy to EC2

on:
  push:
    branches:
      - master
  # Manual runs from the GitHub UI: Actions -> "Deploy to EC2" -> Run workflow
  # -> pick any branch. github.ref_name below resolves to that branch.
  workflow_dispatch:

permissions:
  id-token: write # required to mint the OIDC token for AssumeRoleWithWebIdentity
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Port 22 on the PROD box's security group only allows Jenkins' static
      # IP, so a GitHub-hosted runner (no fixed IP) can never reach it over
      # SSH. Deploy via SSM Run Command instead - no inbound access needed.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::845021709999:role/github-actions-open-wearables-master
          aws-region: ap-south-1

      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: i-0182461471901a679
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          cat > /tmp/deploy.sh <<'SCRIPT'
          # SSM Run Command executes this as root with no $HOME. The real
          # checkout at /home/ubuntu/open-wearables is owned by ubuntu, and
          # only ubuntu has the SSH deploy key for the github-wearable host
          # alias - running the actual deploy as root would hit "dial ...
          # dubious ownership" and a missing-SSH-key clone failure without
          # ever touching Docker. Run the real work as ubuntu.
          set -euo pipefail

          cat > /tmp/ow-deploy-inner.sh <<'INNER'
          # Fail the deploy if any command fails (previously a failed
          # git pull was silently ignored, so stale code kept building).
          set -euo pipefail

          # Navigate to project directory
          mkdir -p ~/open-wearables
          cd ~/open-wearables

          # If not a git repo, clone it
          if [ ! -d .git ]; then
            git clone git@github-wearable:__GH_REPOSITORY__.git .
          fi

          # Force the checkout to exactly match the pushed branch. A plain
          # `git pull` aborts on a dirty/diverged tree, leaving old source on
          # disk. fetch + hard reset guarantees the build uses the new code.
          git fetch origin __GH_REF_NAME__
          git reset --hard origin/__GH_REF_NAME__
          git clean -ffd
          echo "Checked out commit: $(git rev-parse --short HEAD)"

          # Handle .env file (copy from /home/ubuntu/wearables.env)
          if [ -f /home/ubuntu/wearables.env ]; then
            cp /home/ubuntu/wearables.env backend/config/.env
            echo "Updated backend/config/.env from /home/ubuntu/wearables.env"
          elif [ ! -f backend/config/.env ]; then
            cp backend/config/.env.example backend/config/.env
            echo "Warning: /home/ubuntu/wearables.env not found. Created from example."
          fi

          # Diagnostics for the "port already allocated" failure: show what
          # actually resolves for host port bindings and what's already
          # bound on the host before we touch anything. Remove once the
          # root cause of the port collision is confirmed.
          echo "--- Resolved compose port bindings ---"
          docker compose config | grep -B4 "published:" || true
          echo "--- Root .env in project dir (affects \${VAR} substitution) ---"
          cat .env 2>/dev/null || echo "no root .env file"
          echo "--- REDIS_PORT in current shell env ---"
          env | grep -i REDIS_PORT || echo "REDIS_PORT not set in shell env"
          echo "--- What's already listening on 6379 ---"
          ss -ltn | grep 6379 || echo "nothing listening on 6379 via ss"
          docker ps -a --format '{{.Names}}: {{.Ports}}' | grep 6379 || echo "no container publishing 6379"

          # Stop and remove existing containers first so host ports are
          # released and no stale container lingers before recreate.
          docker compose down --remove-orphans

          # Rebuild images (code changes invalidate the COPY layer, so
          # normal cache is fine and fast). Builds app + frontend; the shared
          # open-wearables-platform:latest image is produced by the app build.
          docker compose build

          # Clean restart. --force-recreate recreates EVERY container — without
          # it, worker/beat/flower keep the old container (they share the
          # :latest image with no build section, so compose thinks they are
          # unchanged and skips them, leaving stale code running).
          docker compose up -d --force-recreate --remove-orphans

          # Drop dangling images left by the rebuild.
          docker image prune -f

          # Show resulting state in the deploy log.
          docker compose ps
          INNER

          chown ubuntu:ubuntu /tmp/ow-deploy-inner.sh
          chmod +x /tmp/ow-deploy-inner.sh
          su - ubuntu -c /tmp/ow-deploy-inner.sh
          rm -f /tmp/ow-deploy-inner.sh
          SCRIPT

          # Substitute the GitHub context values (kept out of the heredoc's
          # interpolation so the script is one plain literal, easy to eyeball).
          sed -i "s|__GH_REPOSITORY__|${GH_REPOSITORY}|g; s|__GH_REF_NAME__|${GH_REF_NAME}|g" /tmp/deploy.sh

          echo "--- deploy.sh: $(wc -l < /tmp/deploy.sh) lines ---"

          # Build the SSM parameters as a JSON file directly instead of
          # piping through `jq` inside a nested command substitution - that
          # pattern proved unreliable to debug (a prior run silently sent an
          # empty commands=[""] payload, so the script never touched Docker
          # even though the workflow reported success).
          python3 -c "
          import json
          with open('/tmp/deploy.sh') as f:
              content = f.read()
          with open('/tmp/ssm-params.json', 'w') as f:
              json.dump({'commands': [content]}, f)
          "

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --comment "GitHub Actions deploy ${GH_SHA}" \
            --query 'Command.CommandId' --output text)

          echo "SSM command id: $COMMAND_ID"

          for i in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "[$i] Status: $STATUS"
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "--- stdout ---"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text
                echo "--- stderr ---"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' --output text
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "Timed out waiting for the SSM command to finish"
          exit 1
